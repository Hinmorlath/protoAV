<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./../img/AnimaVivo_logo_bordeBlanco.png" type="image/x-icon">
    <link rel="stylesheet" href="./../css/editor/colores.css">
    <link rel="stylesheet" href="./../css/fontawesome/css/all.css">
    <link rel="stylesheet" href="./../css/editor/general.css">
    <link rel="stylesheet" href="./../css/editor/menu.css">
    <link rel="stylesheet" href="./../css/editor/iconos.css">
    <link rel="stylesheet" href="./../css/editor/agregar.css">
    <link rel="stylesheet" href="./../css/editor/perfil.css">
    <title>Mi Perfil</title>
</head>
<body>
    <!-- Header a la hora de hacer una saga, que es practicamente el mismo header que aparece a la hora de agregar una anime -->
    <header class="header1">
        <!-- Enlace para regresar al menú del editor -->
        <a class="logoCh" href="./animes.html">
            <img src="./../img/AnimaVivo_logo.png" alt="Logotipo" height="128px" width="128px">
        </a>

        <span>Mi Perfil</span>
        
        <!-- Icono del usuario y las herramientas que ofrece este Rol -->
        <div class="herUsu">
            <div class="icoNot">
                <span class="fa-regular fa-bell"></span>
            </div>
            <div id="iconUsuario">
                <img src="./../img/AnimaVivo_logo.png" alt="Icono del usuario" height="128px" width="128px">
            </div>
        </div>
    </header>

    <main>
        <!-- Formulario donde el Editor podrá actualizar su información -->
        <form class="formPerfil" action="#" method="post">
            <!-- Imagen del Editor -->
            <div class="imgUserPerfil">
                <input type="file" name="imgUser" id="imgUser" accept="image/*">
                <label for="imgUser">
                    <span class="fa-solid fa-user-secret"></span>
                </label>
            </div>
            <!-- Datos1 -->
            <div class="datos1">
                <!-- Nombre del editor -->
                <label for="nomEditor">Nombre de usuario</label>
                <input type="text" name="nomEditor" id="nomEditor">
                <!-- Apellidos del editor -->
                <label for="apeEditor">Apellidos</label>
                <input type="text" name="apeEditor" id="apeEditor">
            </div>
            
            <!-- Datos2 -->
            <div class="datos2">
                <!-- Rol del usuario -->
                <span>Tu rol es: <span>RolUsuario</span></span>
                <!-- Correo del editor -->
                <label for="corEditor">Correo</label>
                <input type="email" name="corEditor" id="corEditor">
                <!-- Telefono o celular del editor -->
                <label for="telEditor">Número telefónico</label>
                <input type="tel" name="telEditor" id="telEditor">
                <!-- Contraseña del editor -->
                <label for="passEditor">Contraseña</label>
                <input type="password" name="passEditor" id="passEditor">
                <!-- Confirmación de contraseña del editor -->
                <label for="confPass">Confirmar contraseña</label>
                <input type="password" name="confPass" id="confPass">
    
                <!-- Botón de envío -->
                <button type="submit">
                    Editar
                </button>
            </div>
        </form>
    </main>
</body>
</html>
